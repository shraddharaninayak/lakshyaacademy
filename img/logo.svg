<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E1E"/>
      <stop offset="100%" stop-color="#5B0E0E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C772F"/>
    </linearGradient>
  </defs>

  <!-- Emblem Shield -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#shieldGrad)" filter="drop-shadow(0 4px 10px rgba(139,30,30,0.3))"/>
    <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Target / Lakshya Bullseye & Flame Symbol -->
    <circle cx="32" cy="32" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="32" cy="32" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="32" cy="32" r="4" fill="url(#goldGrad)"/>
    <path d="M32 8 L32 18 M32 46 L32 56 M8 32 L18 32 M46 32 L56 32" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="88" y="36" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="22" font-weight="800" fill="#0D1B2A" letter-spacing="0.5">THE LAKSHYA</text>
  <text x="88" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#8B1E1E" letter-spacing="2.5">CAREER ACADEMY</text>
  <text x="88" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#6B7280" letter-spacing="0.5">MPSC • UPSC • CIVIL SERVICES • NASHIK</text>
</svg>
